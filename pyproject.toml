[project]
name = "symphony-cli"
version = "0.1.0"
description = "Command-line port of Symphony AI: CLAP semantic music search, mixes and recommendations"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.17",
    "typer>=0.12",
    "rich>=13.0",
    "mutagen>=1.47",
]

[project.optional-dependencies]
index = ["hnswlib>=0.8"]
dev = ["pytest>=8.0"]

[project.scripts]
symphony = "symphony_cli.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
